# openbloxd reference configuration.
#
# Everything that could weaken a sandbox's isolation is here and nowhere else.
# No request field maps to any of it: a request naming one is rejected.

socket: /run/openbloxd/openbloxd.sock
# The group that may reach the socket. This is the whole access control list:
# membership grants sandbox creation.
socket_group: openbloxd
reap_interval: 1m

# A network listener, so the daemon can run on a host of its own. OPTIONAL and
# off by default: omit this block entirely and the daemon serves only the Unix
# socket above, which stays the recommended arrangement wherever the caller and
# the daemon share a host.
#
# Nothing here has a default. A daemon that started listening on a network
# interface because a key was omitted is the failure this block exists to
# avoid, so every field below is required once `listen` is present.
#listen:
#  address: "127.0.0.1:9443"
#  tls:
#    cert_file: /etc/openbloxd/tls/server.crt
#    key_file: /etc/openbloxd/tls/server.key
#    # The CA that signs callers. It must sign NOTHING else: with certificate
#    # verification alone, this CA is the entire access control list.
#    client_ca_file: /etc/openbloxd/tls/clients-ca.crt
#    # The second gate, and the reason a CA mis-issuance is survivable. Only a
#    # certificate whose Common Name is listed here is accepted. Revoking a
#    # caller means removing its name and restarting: there is no CRL or OCSP.
#    allowed_client_cns: ["sandbox-caller"]

profiles:
  code-exec:
    # Pin a digest. A tag can be repointed by whoever controls the registry,
    # and the image is the sandbox's entire userland.
    image: ghcr.io/blox-eng/openblox-sandbox@sha256:CHANGEME
    runtime: runsc          # gVisor. Anything else trades away the isolation.
    egress: none            # No interface at all: no resolver, no route.
    user: "1000:1000"
    cpus: 2
    memory_mb: 2048
    disk_mb: 1024           # tmpfs, drawn from memory; must not exceed it.
    max_processes: 256      # Without this a fork bomb exhausts host PIDs.
    # How many sandboxes this profile may hold at once. Every other bound here
    # limits ONE sandbox; this is the only one that limits how many exist, and
    # without it a caller looping on create exhausts host memory without ever
    # violating a policy. Omit for unlimited.
    #
    # Size it as memory_mb x this number, with headroom: the runtime enforces
    # memory_mb approximately, and roughly 1.4x the configured figure has been
    # observed resident before the kill lands. A refused create returns 429 with
    # kind "at_capacity", so a caller can tell it from a malformed request.
    #
    # The cap is PER PROFILE, so a host must cover the SUM across profiles at
    # once, not the largest one. The two profiles below are illustrative, not a
    # recommended pair: 8 x 2048 and 4 x 4096, at ~1.4x, is already ~45 GiB of
    # worst-case commitment. Pick numbers your host can actually hold.
    max_sandboxes: 8
    idle_timeout: 30m
    max_age: 4h
    default_timeout: 60s
    max_timeout: 10m

  browser:
    # No reference browser image is published; supply your own.
    image: ghcr.io/example/headless-browser@sha256:CHANGEME
    runtime: runsc
    egress: none
    user: "1000:1000"
    cpus: 2
    memory_mb: 4096
    disk_mb: 2048
    max_processes: 256
    # Counted per profile, not globally: browser sandboxes cost more memory
    # each, so they get their own smaller ceiling rather than competing for
    # code-exec's. Remember the host must cover both profiles at once.
    max_sandboxes: 4
    idle_timeout: 30m
    max_age: 4h
