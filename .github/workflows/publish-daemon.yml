name: Publish daemon

# Builds the openbloxd binary and attaches it to the release for a `v*` tag.
#
# openbloxd is installed on a host, not pulled as an image: it holds the Docker
# socket so the containerized callers do not have to, and running it in a
# container with that socket mounted would put the privilege straight back where
# this daemon exists to take it from. So the artifact is a binary, which is what
# deploy/openbloxd.service expects at /usr/local/bin/openbloxd, plus the unit and
# example config so an operator gets all three versioned together.
#
# Tag-triggered, matching publish-image.yml: release.yml cuts the tag from
# conventional commits once CI is green on main, and both publish jobs hang off
# that tag rather than off each other.
#
# Each binary ships with a CycloneDX SBOM read from the binary's own build info,
# and with GitHub artifact attestations for both: Sigstore-signed statements,
# tied to this workflow and the tagged commit, that a user checks with
# `gh attestation verify`. The build is reproducible — see RELEASING.md — so
# the attestation is not the only way to tie a binary to its source.
#
# Static (CGO_ENABLED=0) on purpose. The daemon runs on whatever host an operator
# installs it on, and a binary that depends on the build host's libc is a support
# burden for no benefit — it links nothing that needs cgo.

on:
  push:
    tags: ['v*']
  # To re-publish a tag whose run failed, dispatch ON the tag:
  #   gh workflow run publish-daemon.yml --ref v1.2.3
  # Not on main with the tag as an input: the attestations record the ref and
  # commit the run was started from, so a run started on main would sign a
  # statement naming main as the source of a binary built from the tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per tag: a dispatch and a tag push for the same tag must not race
  # each other's uploads.
  group: publish-daemon-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish openbloxd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Uploading a release asset is a write to the release, which lives under
      # contents. Scoped to this job rather than the workflow.
      contents: write
      # Signing an attestation: an OIDC token proves to Sigstore that THIS
      # workflow, at THIS commit, made the statement.
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      # Never cancel the sibling arch. A cancelled leg leaves the release holding
      # one architecture and silently missing the other — the same
      # partially-published failure this workflow exists to end, just harder to
      # spot than shipping nothing.
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      # Refuse anything but a plain semver tag BEFORE checkout. This job builds,
      # signs and uploads with contents: write, so a dispatch on a branch must
      # not get as far as building it.
      - name: Resolve and validate the tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ] || [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing to build from $REF_TYPE '$TAG': dispatch this workflow on a semver release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: a release artifact must not depend on cache contents written
      # by earlier runs. Modules are verified against go.sum either way; the
      # build cache's compiled objects would not be.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # -trimpath so the binary does not embed the runner's paths, matching
          # the `build-daemon` make target developers use locally. The version
          # is stamped so an operator can ask a host what it is running, and an
          # unstamped local build stays honestly "dev".
          CGO_ENABLED=0 GOOS=linux go build -trimpath \
            -ldflags "-X main.version=${TAG}" \
            -o "openbloxd-linux-${GOARCH}" ./cmd/openbloxd
          sha256sum "openbloxd-linux-${GOARCH}" > "openbloxd-linux-${GOARCH}.sha256"

      - name: Verify the binary runs and reports its version
        # A release asset that cannot execute is worse than a missing one: the
        # install step succeeds and the daemon fails at boot on the host.
        #
        # Assert the STAMP, not merely that the flag runs. If -X main.version
        # ever stops landing — the var is renamed, moved out of main, or the
        # ldflags get dropped in a refactor — the binary prints "dev", and
        # `--version` alone would still exit 0. A release asset claiming to be
        # someone's local build is precisely what the "dev" default exists to
        # make visible, so let it fail here instead.
        #
        # The arm64 leg cannot execute on this runner, so it checks the
        # architecture only. That is weaker, and deliberately not dressed up as
        # more: the stamping logic is arch-independent, so amd64 covers it.
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GOARCH" = "amd64" ]; then
            got="$(./"openbloxd-linux-${GOARCH}" --version)"
            if [ "$got" != "$TAG" ]; then
              echo "version stamp is '$got', expected '$TAG'" >&2
              exit 1
            fi
          else
            file "openbloxd-linux-${GOARCH}" | grep -q 'ARM aarch64'
          fi

      # From the binary, not the module graph: the SBOM lists what was linked
      # in, not what go.mod happens to require. Pinned through the Go checksum
      # database like any module; v1.10.0 is the newest that builds with
      # go.mod's Go.
      - name: Generate the SBOM
        env:
          GOARCH: ${{ matrix.goarch }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # env -u, not a `GOARCH= ` prefix: the tool itself must build for the
          # runner, while the arguments below still name the target arch. The
          # prefix form expresses that too, but reads as the mistake shellcheck
          # takes it for (SC2097/SC2098).
          env -u GOARCH go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0 \
            bin -json -version "$TAG" \
            -output "openbloxd-linux-${GOARCH}.cdx.json" "openbloxd-linux-${GOARCH}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: openbloxd-linux-${{ matrix.goarch }}

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: openbloxd-linux-${{ matrix.goarch }}
          sbom-path: openbloxd-linux-${{ matrix.goarch }}.cdx.json

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          # `gh release upload` needs the release OBJECT, not just the tag ref,
          # and does not create one. Two ways that bites: a hand-pushed tag has
          # no release at all, and on the normal path go-semantic-release creates
          # the tag ref and the release as separate API calls — this job's trigger
          # fires on the first. The build usually outlasts that gap, but "usually"
          # is the wrong property for the release path.
          #
          # Wait rather than create: creating it here would race the sibling
          # matrix leg for who creates it.
          for _ in $(seq 1 12); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "no release object for tag '$TAG' after 120s — refusing to guess" >&2
            exit 1
          fi

          # The two legs upload disjoint filenames, so they cannot collide;
          # --clobber is here to make a re-dispatch idempotent rather than an
          # error on an asset that already exists.
          gh release upload "$TAG" \
            "openbloxd-linux-${GOARCH}" \
            "openbloxd-linux-${GOARCH}.sha256" \
            "openbloxd-linux-${GOARCH}.cdx.json" \
            --clobber

      # The binaries are statically linked, so each dependency's object code is
      # inside them, and Apache-2.0, MIT and BSD all permit that copy only if
      # their notices travel with it. Generated here rather than committed: the
      # module set moves with the dependencies, and a stale bundle that claims
      # completeness is worse than an obviously absent one.
      - name: Generate the third-party licence bundle
        # One arch only, for the same reason as the unit and config below. The
        # script unions both architectures' module sets, so each leg would
        # produce the same file and the second upload would be pure race.
        if: matrix.goarch == 'amd64'
        run: .github/scripts/third-party-licenses.sh

      - name: Attach the unit, example config, and licences
        # One arch only — these are arch-independent, and both legs uploading
        # them would have the two races --clobber cannot help with.
        if: matrix.goarch == 'amd64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            deploy/openbloxd.service \
            deploy/openbloxd.example.yaml \
            THIRD_PARTY_LICENSES.txt \
            --clobber

  # Verify the release the way a user would, from the published assets, on a
  # machine of each architecture — so the arm64 binary is executed, not merely
  # inspected, and the verification commands in the docs are proven to work
  # against a real release on every tag.
  verify:
    name: Verify published openbloxd (${{ matrix.goarch }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      # gh attestation verify reads the attestations API with this token. Without
      # it the verification fails after the assets are already public — the one
      # moment the check exists to cover.
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Download, verify, and run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          bin="openbloxd-linux-${GOARCH}"
          gh release download "$TAG" -p "$bin" -p "$bin.sha256" -p "$bin.cdx.json"
          sha256sum -c "$bin.sha256"
          gh attestation verify "$bin" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/publish-daemon.yml" \
            --source-ref "refs/tags/$TAG"
          gh attestation verify "$bin" --repo "$GH_REPO" \
            --predicate-type https://cyclonedx.org/bom
          chmod +x "$bin"
          got="$(./"$bin" --version)"
          if [ "$got" != "$TAG" ]; then
            echo "version stamp is '$got', expected '$TAG'" >&2
            exit 1
          fi
          echo "verified $bin $TAG on $(uname -m)"

      # The licence bundle is a condition of redistributing the binaries above,
      # so a release that published them without it is not one to leave standing.
      # Checked from the published asset, like everything else here: generating
      # it successfully in the publish job does not prove it reached the release.
      - name: Verify the licence bundle was published
        if: matrix.goarch == 'amd64'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p THIRD_PARTY_LICENSES.txt
          # Spot-check a module that is linked in on every build rather than
          # merely asserting the file is non-empty.
          grep -q '^github.com/docker/docker .* — NOTICE$' THIRD_PARTY_LICENSES.txt
          echo "licence bundle present for $TAG"
