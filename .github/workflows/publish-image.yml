name: Publish image

# Builds the reference sandbox image and pushes it to ghcr.
#
# openblox pulls an absent image on create, so publishing is what makes the
# default work on a host that has never seen it. A release tag publishes the
# matching image version; main publishes :edge so the tip is always testable
# without cutting a release.
#
# The digest is printed to the job summary. Pin THAT downstream, not the tag: an
# image is the sandbox's entire userland, and whoever controls the registry can
# repoint a tag. A version tag is never overwritten by this workflow — a fix is
# a new version — and every pushed digest carries a Sigstore-signed build
# provenance attestation (`gh attestation verify oci://...`) plus the SBOM and
# provenance buildx attaches to the image index.
#
# Every ${{ }} value is passed through env rather than interpolated into a run:
# script, because this job holds a registry-write token.

on:
  pull_request:
    paths:
      - 'image/**'
      - '.github/workflows/publish-image.yml'
  push:
    branches: [main]
    paths:
      - 'image/**'
      - '.github/workflows/publish-image.yml'
    tags: ['v*']
  # Dispatch on a release tag to publish that version (a run that failed on
  # the tag push), or on main to refresh :edge:
  #   gh workflow run publish-image.yml --ref v1.2.3
  # The attestation records the ref the run started from, so the version is
  # taken from that ref rather than from an input that could disagree with it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # A pull request builds the image and asserts the contract, but never pushes.
  # Without this a broken Dockerfile is only discovered after it reaches main,
  # where the failure is a missing image rather than a red check.
  verify:
    name: Build & Verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Single-platform and loaded into the local daemon: buildx cannot --load a
      # multi-platform manifest, and running the contract check matters more here
      # than proving both architectures build.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image
          platforms: linux/amd64
          push: false
          load: true
          tags: openblox-sandbox:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the contract
        run: |
          docker run --rm --entrypoint /bin/sh openblox-sandbox:pr -c \
            'command -v bash && command -v python3 && command -v nc && [ "$(id -u)" -ne 0 ]'

  publish:
    name: Build & Push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Signing the provenance attestation: an OIDC token proves to Sigstore
      # that THIS workflow, at THIS commit, built the digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolve the version BEFORE anything can push. A release tag publishes
      # that version plus :latest; main publishes :edge; any other ref is
      # refused, so a branch cannot publish under either name.
      - name: Resolve tags
        id: meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openblox-sandbox"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "refusing tag '$REF_NAME': expected semver like v1.2.3" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            printf 'tags=%s:%s,%s:latest\n' "$image" "$version" "$image" >> "$GITHUB_OUTPUT"
          elif [ "$REF_NAME" = main ]; then
            printf 'tags=%s:edge\n' "$image" >> "$GITHUB_OUTPUT"
          else
            echo "refusing to publish from $REF_TYPE '$REF_NAME': only release tags and main publish" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published version is immutable: users pin it, and a rebuild would give
      # the same name to different bytes. A fix ships as a new version.
      - name: Refuse to overwrite a published version
        if: steps.meta.outputs.version != ''
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already published; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image
          # arm64 as well as amd64: Apple Silicon is where most people will try
          # this first, and emulating the whole sandbox to run a demo is not a
          # first impression worth having.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true
          # No layer cache: a published image must not depend on cache contents
          # written by earlier runs.
          no-cache: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Smoke-test the published image, by digest, against the contract the
      # Dockerfile asserts at build time — on BOTH platforms. The build only
      # proves it held on the build platform; arm64 runs here under the QEMU
      # set up above. Then verify the attestation the way a user would.
      - name: Verify the pushed image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --entrypoint /bin/sh "$ref" -c \
              'command -v bash && command -v python3 && command -v nc && [ "$(id -u)" -ne 0 ]'
            echo "contract holds for $ref on $platform"
          done
          gh attestation verify "oci://$ref" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-image.yml"

      - name: Report the digest to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '## Sandbox image published'
            echo
            echo 'Tags:'
            echo
            printf '%s\n' "$TAGS" | tr ',' '\n' | sed 's/^/- `/; s/$/`/'
            echo
            echo 'Pin this digest rather than a tag:'
            echo
            echo '```'
            printf '%s@%s\n' "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openblox-sandbox" "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
