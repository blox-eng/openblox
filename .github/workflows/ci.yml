name: CI

# No paths-ignore. These jobs are required for merge, and a skipped required
# check never reports — so a docs-only pull request would be unmergeable
# forever, with nothing the author could do about it. The jobs are fast; that
# is a better trade than a class of PR that silently cannot land.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conventional Commits
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          allowed-commit-types: "feat,fix,cicd,chore,patch,release,test,docs,refactor,ci,dev,perf,build,revert"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: conventional-commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # The changelog guard reads the newest tag; without this the checkout
          # has none and the guard would have nothing to check.
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Changelog documents the latest release
        run: .github/scripts/changelog-guard.sh
      - name: Docs pin the latest release
        run: .github/scripts/pin-docs.sh --check
      # Build the licence bundle on every PR, not only at release time. The
      # script fails on a dependency that ships no licence file, and the PR that
      # adds such a dependency is the moment to find out — at release time the
      # tag is already cut and the choice is between blocking the release and
      # shipping without the notices.
      - name: Third-party licence bundle builds
        run: .github/scripts/third-party-licenses.sh
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
          skip-cache: true
          skip-save-cache: true
        env:
          GOPROXY: https://proxy.golang.org,direct
      # actionlint does not lint shell without shellcheck, and nothing else
      # did either: install.sh shipped with only human review.
      - name: shellcheck
        run: sudo apt-get install -y -qq shellcheck && make lint-sh
      - name: setup.sh unit tests
        run: make test-setup

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The race detector requires cgo, so it is enabled here even though the
      # library itself needs none. The integration-build job below pins
      # CGO_ENABLED=0 to prove no cgo dependency creeps into the build.
      #
      # -coverpkg=./... so that code one package's tests reach in another counts,
      # and so this profile merges with the integration job's (#10).
      - name: Run tests
        env:
          CGO_ENABLED: '1'
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=unit.out -v ./...
      - name: Upload the coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: unit.out
          retention-days: 7

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Gates on NEW reachable vulnerabilities. govulncheck exits non-zero on any
      # finding, which is useless as a gate when a dependency has a reachable
      # vulnerability with no published fix — the check goes permanently red and
      # people learn to ignore it. Known-unfixable findings live in
      # .github/vuln-allowlist.txt with a reason, rather than being suppressed.
      #
      # Pinned rather than @latest, like every other tool here: the scanner is
      # part of the gate, and a gate that changes under an unchanged commit is
      # not reproducible. The vulnerability DATABASE is still live, which is
      # the point. v1.9.0 is the newest release; it builds with go.mod's Go.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          .github/scripts/vulncheck.sh

  integration-build:
    name: Integration Tests (compile only)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile integration tests
        env:
          CGO_ENABLED: '0'
        # kata adds the Kata consumer, which only kata.yml runs. Compiling it
        # here is what stops it rotting between that workflow's runs.
        run: go build -tags integration ./... && go vet -tags 'integration kata' ./...

  # The engine is only actually verified by the integration suite: containment on
  # a live container, egress blocked, the reaper, the resource caps under attack.
  # Everything else in this file grades a package whose unit coverage is 17.7%.
  #
  # This was long assumed to need a self-hosted box. It does not: gVisor's systrap
  # platform uses seccomp and does not require KVM or nested virtualisation, so a
  # standard hosted runner can register runsc. That also keeps the suite off a
  # self-hosted runner, which for a public repo would mean executing a stranger's
  # PR on our own hardware.
  #
  # Both architectures run the whole suite natively — adversarial cases included
  # — because a release ships binaries and an image for each. The amd64 leg keeps
  # the job name branch protection already requires.
  integration:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: lint
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Integration Tests (gVisor)
            runner: ubuntu-latest
          - name: Integration Tests (gVisor, arm64)
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Bounded and retried, because this is the one step that reaches outside
      # the runner. Unbounded, a stalled mirror consumes the job's whole budget
      # and the run is CANCELLED rather than failed — and a cancelled run is
      # indistinguishable from "no run yet" to release.yml, which gates on a
      # green CI run. So a transient apt stall here does not fail loudly; it
      # silently skips a release. Fail fast instead, after trying three times.
      - name: Install gVisor
        timeout-minutes: 6
        run: |
          set -euo pipefail
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::gVisor install: '$*' failed after $n attempts"
                return 1
              fi
              echo "attempt $n of '$*' failed; retrying in $((n * 5))s"
              sleep "$((n * 5))"
              n=$((n + 1))
            done
          }
          retry curl -fsSL --max-time 60 -o /tmp/gvisor-archive.key https://gvisor.dev/archive.key
          sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg /tmp/gvisor-archive.key
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          retry sudo apt-get update -qq
          retry sudo apt-get install -y -qq runsc
          # Register explicitly rather than trusting the package's postinst. It
          # does register on some hosts (it logs "Runtime runsc not found:
          # adding") but did not on this runner image, and a silently
          # unregistered runtime turns the whole suite red one step later.
          # `runsc install` merges into /etc/docker/daemon.json and is idempotent.
          sudo runsc install
          sudo systemctl restart docker
          runsc --version

      # openblox refuses to fall back to runc, so without this the whole suite
      # would fail on ErrRuntimeUnavailable rather than on anything it tests.
      # Asserted as its own step so that failure is legible instead of arriving
      # as fifty identical test errors.
      - name: Verify runsc is registered
        run: |
          set -euo pipefail
          docker info --format '{{range $k, $v := .Runtimes}}{{$k}} {{end}}' | tr ' ' '\n' | grep -qx runsc
          # Prove it actually boots a guest, not merely that it is listed: a
          # registered-but-broken runtime is the failure this guards against.
          kernel=$(docker run --rm --runtime=runsc --network=none alpine:3.20 uname -r)
          echo "guest kernel: $kernel"
          case "$kernel" in
            *gvisor*) ;;
            *) echo "::error::runsc ran but the guest is not gVisor ($kernel)"; exit 1 ;;
          esac

      # -count=1 because these assert against live host state (process counts,
      # free memory) that a cached PASS would silently stand in for.
      #
      # Both legs measure coverage so they run the same way; amd64's profile is
      # the one reported, since the two cover the same code.
      - name: Run integration tests
        env:
          CGO_ENABLED: '0'
        run: go test -tags integration -count=1 -covermode=atomic -coverpkg=./... -coverprofile=integration.out -v -timeout 20m ./...
      - name: Upload the coverage profile
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-latest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: integration.out
          if-no-files-found: ignore
          retention-days: 7

  # Coverage per package, unit and with integration, with the change against
  # main (#10). It reports and never gates: release.yml releases only when the
  # whole run concludes success, so continue-on-error keeps any failure in here
  # (a missing artifact, a bad baseline, the timeout) from costing a release.
  # There is deliberately no minimum; see #10 for why a floor would push tests
  # toward mocking the Docker API.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test, integration]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      # Only to keep one coverage comment per pull request up to date.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Report coverage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          gh run download "$RUN_ID" -R "$REPO" -n coverage-unit -D "$work"
          # Missing when the integration job failed: the table says so.
          gh run download "$RUN_ID" -R "$REPO" -n coverage-integration -D "$work" \
            || echo "::warning::no integration coverage profile in this run"

          # The newest green push to main is the baseline. Without one the
          # table still prints, with no change column.
          base_run=$(gh run list -R "$REPO" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$base_run" ]; then
            gh run download "$base_run" -R "$REPO" -n coverage-summary -D "$work/base" \
              || echo "::warning::run $base_run on main has no coverage summary"
          fi

          integration=""
          [ -f "$work/integration.out" ] && integration="$work/integration.out"
          baseline=""
          [ -f "$work/base/coverage.json" ] && baseline="$work/base/coverage.json"
          {
            echo "### Coverage"
            echo
            .github/scripts/coverage-report.sh "$work/unit.out" "$integration" "$baseline" coverage.json
          } > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the summary as the next baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage.json
          retention-days: 90

      # A fork's token is read-only, so its pull requests get the job summary
      # only. One comment, found by its marker and edited in place, so a long
      # pull request does not collect one per push.
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- openblox-coverage -->'
          { echo "$marker"; cat coverage.md; } > comment.md
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
