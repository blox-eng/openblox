name: Release

# Tags a semver release from conventional commits once CI is green on main.
#
# For a Go module a tag *is* the release for library consumers — there is no
# registry to publish to, so they can require a real version instead of a commit
# pseudo-version.
#
# The tag is not inert, and this job does not do the publishing. Two workflows
# watch `v*` and hang off the tag rather than off each other:
#   publish-image.yml   builds the sandbox image
#   publish-daemon.yml  builds and attaches the openbloxd binaries
# That makes the token this job pushes with load bearing — see the note on it
# below. It also means a tag cut without those workflows firing is a release that
# ships nothing, which is how v0.3.0 came to have no assets.
#
# The full test suite — lint, race, the gVisor integration and adversarial
# suites — is not re-run here. It is the CI run this workflow is triggered BY,
# on exactly the commit that gets tagged: the checks below refuse to tag
# anything else.
# workflow_run is flagged by zizmor as dangerous-triggers. It is safe here only
# because the job acts solely on a push to this repository's main that CI
# passed, on exactly the commit CI verified, and never checks out or runs
# pull-request code — see its `if:` and first step. Keep it that way.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types:
      - completed

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create Release
    # workflow_run fires for every CI run whose head branch is called "main" —
    # including a pull request from a FORK's main branch, which runs this
    # workflow in the base repository with its secrets. Release only from a push
    # to this repository's main that CI passed.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read-only on purpose. The one write — creating the tag and release — goes
    # through RELEASE_TOKEN in a step of our own, and checkout runs with
    # persist-credentials: false so the built-in token has no consumer left.
    #
    # The changelog job below needs write scopes. It is a separate job so that
    # granting them does not widen this one, which is the job holding the
    # release token.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semrel.outputs.version }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Tag only the commit CI verified. workflow_run checks out the tip of main
      # at the time THIS workflow starts, which is a newer, unverified commit if
      # anything merged while CI ran. That newer commit's own CI run releases it.
      - name: Refuse a commit CI did not verify
        id: verified
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          TIP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$VERIFIED_SHA" != "$TIP_SHA" ]; then
            echo "main moved on to $TIP_SHA while CI verified $VERIFIED_SHA; leaving the release to the newer run"
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      # No ref: the step above established that the default, github.sha, IS
      # the verified commit, and this job never checks out anything else.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.verified.outputs.current == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compute the next version only. The action downloads the latest
      # semantic-release binary and its plugins from a third-party registry at
      # run time, unpinned, so it runs in dry mode holding nothing but this
      # job's read-only token. It never sees RELEASE_TOKEN.
      - name: Compute the next version
        id: semrel
        if: steps.verified.outputs.current == 'true'
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f # v1.24.1
        with:
          dry: true
          allow-initial-development-versions: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A PAT, not the built-in GITHUB_TOKEN: GitHub refuses to start a workflow
      # for a ref pushed with GITHUB_TOKEN, so the tag this step creates would
      # never reach publish-image.yml's `tags: ['v*']` trigger and every release
      # would ship without its container image.
      #
      # RELEASE_TOKEN is a fine-grained PAT scoped to this repository with
      # Contents and Pull requests, read and write: the tag and release here,
      # the changelog pull request in the job below. It expires; when it does this step fails outright rather than
      # silently skipping the image.
      #
      # The version is re-validated before it reaches the tag, and the notes —
      # built from commit messages, which anyone with a merged PR wrote — travel
      # through a file, never through the shell.
      - name: Tag and release the verified commit
        if: steps.semrel.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.semrel.outputs.version }}
          NOTES: ${{ steps.semrel.outputs.changelog }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "refusing version '$VERSION': not semver" >&2
            exit 1
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v${VERSION}" \
            --target "$SHA" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Record the release in CHANGELOG.md.
  #
  # The changelog is written by hand and the prose is the point — it says why a
  # change was made, which no commit subject carries — so nothing here generates
  # content. It promotes the section already written: the entries stay put, only
  # the heading above them and the link definitions below it change.
  #
  # That mechanical half is what kept being left undone, and since #46 leaving it
  # undone blocks every subsequent pull request on a failing Lint. Doing it here
  # means the release that creates the problem also opens its fix.
  #
  # A pull request, not a push to main: the ruleset requires one, with status
  # checks and no bypass actors, so a direct push is rejected outright — and it
  # would be rejected AFTER the tag and release already exist, losing only the
  # changelog commit and failing the job at a point where the release itself
  # cannot be undone. Granting a bypass would let every workflow in this
  # repository push to main unreviewed, which is a poor trade for a docs commit.
  changelog:
    name: Promote changelog
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    # The job waits for its pull request to merge: up to 40 minutes, below.
    timeout-minutes: 45
    # RELEASE_TOKEN does the writes. The built-in token stays read-only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released commit, not the tip: main may have moved on, and this
          # branch must carry that release's changelog and nothing else.
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false

      # RELEASE_TOKEN, not GITHUB_TOKEN: GitHub runs no workflow on a pull
      # request opened with the built-in token, so its required checks never
      # report and it can never merge (#96). The token needs Contents and Pull
      # requests, read and write (RELEASING.md, Credentials).
      - name: Promote the Unreleased section and open a pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          # The script validates VERSION itself and refuses anything that is not
          # plain semver, so it never reaches git or gh as a branch name unchecked.
          .github/scripts/promote-changelog.sh "$VERSION" "$(date -u +%Y-%m-%d)"

          # Already recorded: a re-run, or a maintainer who stamped it by hand
          # before this job got there. Not a failure.
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already records v${VERSION}: nothing to open."
            exit 0
          fi

          branch="docs/changelog-v${VERSION}"
          title="docs: pin the current release, v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CHANGELOG.md
          git commit -m "$title"
          # gh hands GH_TOKEN to git as a credential helper, so the token never
          # sits in a command line. A re-run pushes the same change again and
          # finds its pull request.
          gh auth setup-git
          git push --force origin "$branch:$branch"

          body="$(printf '%s\n' \
            "Opened by the Release workflow after cutting v${VERSION}." \
            "" \
            "Moves the \`## [Unreleased]\` entries under a dated \`## [${VERSION}]\`" \
            "heading and adds its compare link. No prose changed: this is the" \
            "mechanical half of RELEASING.md §8." \
            "" \
            "It merges itself once its checks pass. Until it merges," \
            "\`changelog-guard.sh\` fails Lint on every other pull request.")"

          # Only a pull request from this repository's own branch counts: a fork
          # can open one whose head has the same name, and RELEASE_TOKEN must
          # never merge or update that one. From here on the job uses the number.
          # An API error fails the step, so a re-run never mistakes a lookup
          # failure for a missing pull request.
          number="$(gh pr list --head "$branch" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head "$branch" --title "$title" --body "$body")" ||
              { echo "::error::opening the changelog pull request failed (gh says why above). An expired RELEASE_TOKEN, or one without Pull requests: read and write, is the usual cause (RELEASING.md, Credentials)."; exit 1; }
            number="${url##*/}"
          fi
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "::error::unexpected pull request number '$number'"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr merge "$number" --squash --auto ||
            echo "::warning::Auto-merge is off: merge changelog pull request #${number} by hand."

      # main takes only up-to-date branches, and auto-merge never updates one:
      # a pull request that merged meanwhile would hold this one back forever.
      - name: Keep the pull request up to date until it merges
        # No number: CHANGELOG.md already recorded the release, so no pull
        # request was opened.
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            # The pull request exists, so a failed read is an API error: retry
            # on the next poll.
            state="$(gh pr view "$NUMBER" --json state,mergeStateStatus -q '.state + " " + .mergeStateStatus')" || {
              echo "::warning::could not read pull request #${NUMBER}; retrying"
              sleep 60
              continue
            }
            case "$state" in
              MERGED*) echo "merged"; exit 0 ;;
              CLOSED*) echo "::warning::changelog pull request #${NUMBER} was closed"; exit 0 ;;
              *BEHIND) gh pr update-branch "$NUMBER" || true ;;
            esac
            sleep 60
          done
          echo "::warning::changelog pull request #${NUMBER} has not merged in 40 min: merge it by hand (RELEASING.md §8)"
